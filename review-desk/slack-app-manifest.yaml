# Slack app for Review Desk's Slack bridge. Create it at api.slack.com/apps →
# Create New App → From a manifest, install it to the workspace, then:
#   - Basic Information → App-Level Tokens: generate one with connections:write
#     (xapp-…) → Review Desk setting slackAppToken
#   - OAuth & Permissions: Bot User OAuth Token (xoxb-…) → slackBotToken
#   - invite the bot to the factory channel; its id → slackChannel
# Socket Mode means bb needs no public URL.
display_information:
  name: PR Factory
  description: Review Desk's PR factory in Slack
  background_color: "#1d1c1d"
features:
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: pr-factory
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - pins:write
      - reactions:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
